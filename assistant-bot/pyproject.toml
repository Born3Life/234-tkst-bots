[project]
name = "assistant-bot"
version = "0.1.0"
description = "Telegram бот помощник учебной группы — расписание, память, DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.27",
    "aiohttp>=3.11",
    "aiohttp-socks>=0.11.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-dotenv>=1.1",
    "Pillow>=10.0",
]

[project.scripts]
bot = "bot.__main__:main"
