name: Ping Colab Tunnel
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping tunnel
        shell: bash
        run: |
          URL="${{ vars.COLAB_TUNNEL_URL }}"
          if [ -z "$URL" ]; then
            echo "COLAB_TUNNEL_URL not set — skipping"
            exit 0
          fi
          curl -sS --max-time 15 "$URL" > /dev/null && echo "✅ ping ok" || echo "⚠️ ping failed (expected if Colab offline)"

      - name: Notify if failed
        if: failure()
        run: echo "Colab tunnel unreachable — restart Colab and update COLAB_TUNNEL_URL"
